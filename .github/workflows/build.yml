name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk LenteX7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LenteX7-apk
          path: LenteX7.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lente X7 v1.0.${{ github.run_number }}
          files: LenteX7.apk
